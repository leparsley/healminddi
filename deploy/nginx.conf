# Replace example.com and /var/www/digital-mental-health with your own values.
# Initial HTTP configuration. Add HTTPS with your server panel or certificate tool.
server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/digital-mental-health;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
}
